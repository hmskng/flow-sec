<!DOCTYPE html>
<html>
<head>
    <title>Create Demo User</title>
</head>
<body>
    <h1>Create Demo User</h1>
    <button onclick="createDemoUser()">Create Demo User</button>
    <div id="result"></div>

    <script>
        async function createDemoUser() {
            try {
                // Create demo user using password-based registration
                const formData = new FormData();
                formData.append('email', 'demo@flowsec.com');
                formData.append('username', 'DemoUser');
                formData.append('password', 'demopassword');
                
                const registerResponse = await fetch('https://flowsec-kp3q.onrender.com/api/register', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await registerResponse.json();
                document.getElementById('result').innerHTML = JSON.stringify(result, null, 2);
                
                if (registerResponse.ok) {
                    alert('Demo user created successfully!');
                } else {
                    alert('Error: ' + result.message);
                }
            } catch (error) {
                document.getElementById('result').innerHTML = 'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
