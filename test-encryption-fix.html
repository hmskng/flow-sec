<!DOCTYPE html>
<html>
<head>
    <title>Test Encryption Fix</title>
</head>
<body>
    <h1>Test Message Encryption</h1>
    <button onclick="testEncryption()">Test Encryption</button>
    <div id="results"></div>

    <script>
        // Copy the getChatKey function from dashboard.js
        async function getChatKey(chatId) {
            console.log('getChatKey called with chatId:', chatId);
            
            // Create a consistent key for each chat using the chatId
            const keyMaterial = new TextEncoder().encode(chatId + 'FlowSecChatEncryption2025');
            
            // Import key material
            const importedKey = await window.crypto.subtle.importKey(
                'raw',
                keyMaterial,
                { name: 'PBKDF2' },
                false,
                ['deriveKey']
            );
            
            // Derive AES-GCM key
            const derivedKey = await window.crypto.subtle.deriveKey(
                {
                    name: 'PBKDF2',
                    salt: new TextEncoder().encode('FlowSecSalt' + chatId),
                    iterations: 100000,
                    hash: 'SHA-256'
                },
                importedKey,
                { name: 'AES-GCM', length: 256 },
                false,
                ['encrypt', 'decrypt']
            );
            
            console.log('Generated encryption key for chat:', chatId);
            return derivedKey;
        }

        async function encryptMessage(chatId, text) {
            console.log('encryptMessage called with:', { chatId, text });
            try {
                const key = await getChatKey(chatId);
                console.log('Got encryption key:', key);
                const iv = window.crypto.getRandomValues(new Uint8Array(12));
                const enc = new TextEncoder().encode(text);
                const ciphertext = await window.crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc);
                const result = btoa(String.fromCharCode(...iv) + String.fromCharCode(...new Uint8Array(ciphertext)));
                console.log('Encryption successful, result:', result);
                return result;
            } catch (error) {
                console.error('Encryption failed:', error);
                throw new Error('Failed to encrypt message: ' + error.message);
            }
        }

        async function testEncryption() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p>Testing encryption...</p>';
            
            try {
                const testChatId = '68bd4cffc321263ac78219bd';
                const testMessage = 'test encrypted message';
                
                console.log('Testing with chatId:', testChatId, 'message:', testMessage);
                
                const encrypted = await encryptMessage(testChatId, testMessage);
                
                resultsDiv.innerHTML = `
                    <h3>Encryption Test Results:</h3>
                    <p><strong>Original:</strong> ${testMessage}</p>
                    <p><strong>Encrypted:</strong> ${encrypted}</p>
                    <p><strong>Length:</strong> ${encrypted.length} characters</p>
                    <p><strong>Status:</strong> ✅ SUCCESS</p>
                `;
                
            } catch (error) {
                resultsDiv.innerHTML = `
                    <h3>Encryption Test Results:</h3>
                    <p><strong>Status:</strong> ❌ FAILED</p>
                    <p><strong>Error:</strong> ${error.message}</p>
                `;
                console.error('Test failed:', error);
            }
        }
    </script>
</body>
</html>
